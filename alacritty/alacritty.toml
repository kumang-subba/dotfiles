general.import = [ "~/.config/alacritty/dank-theme.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "Iosevka Term Italics" }
bold = { family = "Iosevka Term Italics" }
italic = { family = "Iosevka Term Italics" }
size = 14

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]

# Smooth cursor fork config

[cursor]
# Set to false to disable completely
smooth_motion = true
# 0.0 = cursor is not moving, 1.0 = cursor moves instantly
smooth_motion_factor = 0.8
# 0.0 = broken, 1.0 = cursor shape is unaffected by movement
smooth_motion_spring = 0.5
# Limits how the cursor size may change
smooth_motion_max_stretch_x = 1.0
smooth_motion_max_stretch_y = 1.0

# see: https://github.com/kumang-subba/alacritty-smooth-cursor/tree/max-smooth-motion-distance
smooth_motion_max_distance = 15
# Override "block" cursor if you don't like how it looks in this fork
